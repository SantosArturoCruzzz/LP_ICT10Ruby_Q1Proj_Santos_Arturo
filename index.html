<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <py-config>
        packages = []
    </py-config>

    <style>
        body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #0b3257, #2561d2); font-family: Arial, sans-serif; }
        .navbar { background-color: #072e58; }
        .navbar-brand, .nav-link { color: white !important; font-weight: bold; }
        .nav-link:hover { opacity: 0.8; }
        .main-container { display: flex; justify-content: center; padding: 40px 20px; }
        .card { width: 100%; max-width: 500px; background-color: white; border-radius: 15px; padding: 25px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); }
        .output { margin-top: 20px; padding: 15px; background-color: #f5f5f5; border-radius: 8px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Store App</a>
            <div class="d-flex gap-3">
                <a class="nav-link" href="index.html">Receipt Generator</a>
                <a class="nav-link" href="sku.html">SKU Generator</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="card">
            <h2 class="text-center mb-4">Order Receipt</h2>
            
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="item1" value="450.00">
                <label class="form-check-label" for="item1">League of Legends Funko Pops - ₱450.00</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="item2" value="120.00">
                <label class="form-check-label" for="item2">Gelato - ₱120.00</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="item3" value="2499.00">
                <label class="form-check-label" for="item3">Dark Souls 3 (Deluxe) - ₱2,499.00</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="item4" value="150.00">
                <label class="form-check-label" for="item4">Tiramisu (per slice) - ₱150.00</label>
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="item5" value="250.00">
                <label class="form-check-label" for="item5">Jojo's Bizarre Adventure Part 7 (Vol) - ₱250.00</label>
            </div>

            <button id="order_btn" class="btn btn-primary w-100 py-2 fw-bold">Create Order</button>

            <div id="show" class="output">
                Your receipt will appear here.
            </div>
        </div>
    </div>

    <script type="py" src="./main.py"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
