<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKU Generator</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2024.1.1/core.css"
    >

    <script
        type="module"
        src="https://pyscript.net/releases/2024.1.1/core.js"
    ></script>


    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b3257, #2561d2);
            font-family: Arial, sans-serif;
        }


  

        .navbar {
            background-color: #072e58;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .nav-link:hover {
            opacity: 0.8;
        }




        .main-container {
            display: flex;
            justify-content: center;
            padding: 60px 20px;
        }


  

        .sku-card {
            width: 100%;
            max-width: 430px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }


   

        .sku-header {
            background: linear-gradient(135deg, #12569e, #082f72);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .sku-header h2 {
            margin: 0;
            font-weight: bold;
        }

        .sku-header p {
            margin: 5px 0 0;
            font-size: 14px;
        }


        .sku-form {
            padding: 25px;
        }

        .form-label {
            font-weight: bold;
            font-size: 14px;
        }

        .form-control,
        .form-select {
            margin-bottom: 15px;
        }




        .generate-btn {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 7px;
            color: rgb(255, 255, 255);
            font-weight: bold;
            background: linear-gradient(135deg, #1769ff, #6918e8);
        }

        .generate-btn:hover {
            opacity: 0.9;
        }


 

        .output {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
            min-height: 50px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <nav class="navbar">

        <div class="container-fluid">

            <a
                class="navbar-brand"
                href="index.html"
            >
            
            </a>


            <div class="d-flex gap-3">

                <a
                    class="nav-link"
                    href="index.html"
                >
                    Receipt Generator
                </a>

                <a
                    class="nav-link"
                    href="sku.html"
                >
                    SKU Generator
                </a>

            </div>

        </div>

    </nav>




    <div class="main-container">

        <div class="sku-card">




            <div class="sku-header">

                <h2>
                    SKU Generator
                </h2>

            </div>




            <div class="sku-form">


 

                <label
                    for="category"
                    class="form-label"
                >
                    Category
                </label>

                <select
                    id="category"
                    class="form-select"
                >

                    <option value="Toy">
                        Toy
                    </option>

                    <option value="Manga">
                        Manga
                    </option>

                    <option value="Dessert">
                        Dessert
                    </option>

                    <option value="Video Game">
                        Video Game
                    </option>

                </select>


   

                <label
                    for="product_name"
                    class="form-label"
                >
                    Product Name
                </label>

                <input
                    type="text"
                    id="product_name"
                    class="form-control"
                    placeholder="e.g. Bottled Water"
                >



                <label
                    for="quantity"
                    class="form-label"
                >
                    Stock Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    class="form-control"
                    placeholder="e.g. 50"
                    min="1"
                >


    

                <button
                    class="generate-btn"
                    py-click="SKU_generator"
                >
                    Generate SKU
                </button>


            

                <div
                    id="sku_output"
                    class="output"
                >
                    Your generated SKU will appear here.
                </div>


            </div>

        </div>

    </div>




    <script
        type="py"
        src="./main.py"
    ></script>


</body>

</html>
